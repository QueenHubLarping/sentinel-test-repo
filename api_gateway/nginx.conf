# API gateway rate limiting (ADR-003).
#
# Rate limiting is enforced HERE, at the edge — not in Django middleware or DRF
# throttle classes. Abusive requests are dropped before they reach a Python worker.
# Do not add @ratelimit / throttle_classes in application code (ADR-003).

# 100 req/s per client IP, shared 10MB zone (~160k IPs tracked).
limit_req_zone $binary_remote_addr zone=public_api:10m rate=100r/s;

server {
    listen 80;
    server_name api.example.com;

    location / {
        # burst absorbs short spikes; nodelay rejects immediately past the limit.
        limit_req zone=public_api burst=200 nodelay;
        limit_req_status 429;

        proxy_pass http://django_upstream;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The /search endpoint that was scraped at 12k req/s gets a tighter limit.
    location /search {
        limit_req zone=public_api burst=50 nodelay;
        limit_req_status 429;
        proxy_pass http://django_upstream;
    }
}
