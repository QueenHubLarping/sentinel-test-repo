# Sentinel on this repo.
#
#  • On every PR  → detect: read docs/adr/ as memory, judge the diff, comment if the
#    PR reverses a past decision.
#  • Comment "/sentinel intentional" → forget: retire that decision (mark the ADR
#    Superseded in docs/adr on the PR branch) so Sentinel stops flagging it.
#  • Comment "/sentinel noise" → improve: dismiss this flag as noise (record the drift
#    in .sentinel-dismissed on the PR branch) so Sentinel stops raising it.
#
# Requirements (one-time):
#   A SELF-HOSTED runner with Ollama running and both models pulled — fully local
#   reasoning + embeddings, no cloud, no API key, no rate limits:
#        ollama serve && ollama pull qwen2.5:3b nomic-embed-text

name: Sentinel

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  pull-requests: write   # comment on the PR
  issues: write          # comment via the issue_comment flow
  contents: write        # forget/improve commit to the PR branch (ADR status / dismissal)

jobs:
  # ---- detect: runs on pull_request events ----
  detect:
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the PR diff is available
      - name: Run Sentinel (detect)
        uses: QueenHubLarping/sentinel-hq@main
        with:
          mode: post
          llm-model: qwen2.5:3b   # fully local reasoning on the GPU runner

  # ---- forget: runs when someone comments "/sentinel intentional" on a PR ----
  resolve:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/sentinel intentional')
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Sentinel (resolve / forget loop)
        uses: QueenHubLarping/sentinel-hq@main
        with:
          mode: post
          llm-model: qwen2.5:3b

  # ---- improve: runs when someone comments "/sentinel noise" on a PR ----
  noise:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/sentinel noise')
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Sentinel (noise / improve loop)
        uses: QueenHubLarping/sentinel-hq@main
        with:
          mode: post
          llm-model: qwen2.5:3b
