# Sentinel on this repo — fully on GitHub, fully on OpenAI (no self-hosted runner, no Ollama).
#
#  • PR opened/updated → detect: reconstruct the team's memory and post a Memory Review card
#    if the PR supersedes a past engineering decision.
#  • Comment "/sentinel intentional" → forget: retire that decision so Sentinel stops flagging it.
#  • Comment "/sentinel noise"       → improve: dismiss the flag as noise.
#
# Memory is the API-sourced snapshot committed at .sentinel/api_snapshot.json. Set the repo
# secret OPENAI_API_KEY (reasoning gpt-4o-mini + embeddings text-embedding-3-small).

name: Sentinel

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  issues: write
  contents: write

jobs:
  detect:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Sentinel (detect)
        uses: QueenHubLarping/sentinel-hq@main
        with:
          mode: post
          llm-provider: openai
          llm-model: gpt-4o-mini
          llm-endpoint: ""
          llm-api-key: ${{ secrets.OPENAI_API_KEY }}
          embedding-provider: openai
          embedding-model: text-embedding-3-small
          embedding-dimensions: "1536"
          embedding-api-key: ${{ secrets.OPENAI_API_KEY }}

  resolve:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/sentinel intentional')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Sentinel (resolve / forget)
        uses: QueenHubLarping/sentinel-hq@main
        with:
          mode: post
          llm-provider: openai
          llm-model: gpt-4o-mini
          llm-endpoint: ""
          llm-api-key: ${{ secrets.OPENAI_API_KEY }}
          embedding-provider: openai
          embedding-model: text-embedding-3-small
          embedding-dimensions: "1536"
          embedding-api-key: ${{ secrets.OPENAI_API_KEY }}

  noise:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/sentinel noise')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Sentinel (noise / improve)
        uses: QueenHubLarping/sentinel-hq@main
        with:
          mode: post
          llm-provider: openai
          llm-model: gpt-4o-mini
          llm-endpoint: ""
          llm-api-key: ${{ secrets.OPENAI_API_KEY }}
          embedding-provider: openai
          embedding-model: text-embedding-3-small
          embedding-dimensions: "1536"
          embedding-api-key: ${{ secrets.OPENAI_API_KEY }}
